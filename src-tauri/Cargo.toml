[package]
name = "rem"
version = "0.1.0"
description = "Reasonably exceptional music player"
authors = ["kyncl", "Rodak123", "ledsim"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["full"] }
rodio = { version = "0.22.2", features = ["symphonia-all"] }
lofty = "0.25.4"
anyhow = "1.0.104"
dirs = "7.0.0"
rayon = "1.12.0"
ignore = "0.4.33"
notify-rust = "4.18.0"
rkyv = { version = "0.8.18", features = ["std", "alloc", "bytecheck"] }
zstd = "0.14.0"
colored = "3.1.1"
xxhash-rust = { version = "0.8.18", features = ["xxh3", "const_xxh3"] }
# We can add TLS, but I think that's quite overkill
sqlx = { version = "0.9.0", features = [ "sqlite", "runtime-tokio" ] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
